<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Martin Schröder – Visitenkarte</title>
<meta name="description" content="Digitale Visitenkarte von Martin Schröder">
<style>
  :root {
    --bg: #e6edf1;
    --card: #ffffff;
    --ink: #14283a;
    --muted: #5b6b78;
    --accent: #0f6e7a;
    --accent-ink: #ffffff;
    --line: #d5dfe5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1a22;
      --card: #172630;
      --ink: #eaf1f5;
      --muted: #9fb0bc;
      --accent: #4cc3d1;
      --accent-ink: #072a30;
      --line: #27404d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    line-height: 1.5;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .head {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 28px 28px 20px;
  }
  .avatar {
    flex: none;
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-ink);
    display: grid;
    place-items: center;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: .02em;
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  h1 { margin: 0; font-size: 1.5rem; line-height: 1.2; }
  .role { margin: 2px 0 0; color: var(--muted); font-size: .95rem; }
  .list { list-style: none; margin: 0; padding: 0 12px; }
  .list li + li { border-top: 1px solid var(--line); }
  .list a, .list div {
    display: flex;
    flex-direction: column;
    padding: 12px 16px;
    color: inherit;
    text-decoration: none;
    border-radius: 10px;
  }
  .list a:hover { background: var(--bg); }
  .label { font-size: .8rem; color: var(--muted); }
  .value { font-size: 1.02rem; word-break: break-word; }
  .actions { padding: 20px 28px 8px; display: grid; gap: 10px; }
  button {
    font: inherit;
    font-weight: 600;
    padding: 13px 16px;
    border-radius: 12px;
    border: 2px solid var(--accent);
    cursor: pointer;
  }
  .primary { background: var(--accent); color: var(--accent-ink); }
  .secondary { background: transparent; color: var(--accent); }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .qr {
    margin: 20px 28px 28px;
    padding: 20px;
    border-radius: 16px;
    background: var(--bg);
    text-align: center;
  }
  #qrcode {
    display: inline-block;
    padding: 12px;
    background: #fff;
    border-radius: 12px;
    line-height: 0;
  }
  #qrcode img, #qrcode canvas { max-width: 100%; height: auto; }
  .qr p { margin: 12px 0 0; font-size: .9rem; color: var(--muted); }
  #hint { color: #b45309; }
</style>
</head>
<body>
<main class="card">
  <header class="head">
    <div class="avatar" id="avatar"></div>
    <div>
      <h1 id="name"></h1>
      <p class="role" id="role"></p>
    </div>
  </header>

  <ul class="list" id="contacts"></ul>

  <div class="actions">
    <button class="primary" id="save" type="button">Kontakt speichern</button>
    <button class="secondary" id="copy" type="button">Link zu dieser Karte kopieren</button>
  </div>

  <section class="qr">
    <div id="qrcode" aria-label="QR-Code zu dieser Visitenkarte"></div>
    <p>Scannen, um diese Karte zu öffnen</p>
    <p id="hint" hidden>Der QR-Code funktioniert erst, wenn die Seite online liegt.</p>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ===== HIER DEINE DATEN EINTRAGEN ===== */
const DATA = {
  vorname: "Martin",
  nachname: "Schröder",
  titel: "Ingenieur Maschinenbau",
  firma: "InterEngineer Systems GmbH",
  telefon: "+49 151 23275457",
  email: "mdh.schroeder@gmx.de",
  foto: "bild.jpg" // optional: Dateiname, z. B. "foto.jpg" (im selben Ordner)
};
/* ====================================== */

const fullName = `${DATA.vorname} ${DATA.nachname}`.trim();
document.title = `${fullName} – Visitenkarte`;
document.getElementById("name").textContent = fullName;
document.getElementById("role").textContent = [DATA.titel, DATA.firma].filter(Boolean).join(" bei ");

const avatar = document.getElementById("avatar");
if (DATA.foto) {
  const img = document.createElement("img");
  img.src = DATA.foto;
  img.alt = fullName;
  avatar.appendChild(img);
} else {
  avatar.textContent = ((DATA.vorname[0] || "") + (DATA.nachname[0] || "")).toUpperCase();
}

const rows = [
  ["Telefon", DATA.telefon, DATA.telefon && "tel:" + DATA.telefon.replace(/[^+\d]/g, "")],
  ["E-Mail", DATA.email, DATA.email && "mailto:" + DATA.email],
  ["Website", DATA.website && DATA.website.replace(/^https?:\/\//, ""), DATA.website],
  ["Adresse", DATA.adresse, DATA.adresse && "https://www.openstreetmap.org/search?query=" + encodeURIComponent(DATA.adresse)]
];
const list = document.getElementById("contacts");
rows.forEach(([label, value, href]) => {
  if (!value) return;
  const li = document.createElement("li");
  const el = document.createElement(href ? "a" : "div");
  if (href) { el.href = href; if (!href.startsWith("tel:") && !href.startsWith("mailto:")) { el.target = "_blank"; el.rel = "noopener"; } }
  el.innerHTML = '<span class="label"></span><span class="value"></span>';
  el.children[0].textContent = label;
  el.children[1].textContent = value;
  li.appendChild(el);
  list.appendChild(li);
});

/* vCard erzeugen und herunterladen */
function esc(s) { return String(s).replace(/([,;\\])/g, "\\$1").replace(/\n/g, "\\n"); }
function buildVCard() {
  const lines = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    `N:${esc(DATA.nachname)};${esc(DATA.vorname)};;;`,
    `FN:${esc(fullName)}`
  ];
  if (DATA.firma) lines.push(`ORG:${esc(DATA.firma)}`);
  if (DATA.titel) lines.push(`TITLE:${esc(DATA.titel)}`);
  if (DATA.telefon) lines.push(`TEL;TYPE=CELL:${DATA.telefon}`);
  if (DATA.email) lines.push(`EMAIL;TYPE=INTERNET:${DATA.email}`);
  if (DATA.website) lines.push(`URL:${DATA.website}`);
  if (DATA.adresse) lines.push(`ADR;TYPE=WORK:;;${esc(DATA.adresse)};;;;`);
  lines.push("END:VCARD");
  return lines.join("\r\n");
}
document.getElementById("save").addEventListener("click", () => {
  const blob = new Blob([buildVCard()], { type: "text/vcard;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${DATA.vorname}-${DATA.nachname}.vcf`.toLowerCase();
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

/* Link kopieren */
const copyBtn = document.getElementById("copy");
copyBtn.addEventListener("click", async () => {
  const url = location.href.split("#")[0];
  try {
    await navigator.clipboard.writeText(url);
    copyBtn.textContent = "Link kopiert";
  } catch (e) {
    prompt("Link zu dieser Karte:", url);
  }
  setTimeout(() => (copyBtn.textContent = "Link zu dieser Karte kopieren"), 2000);
});

/* QR-Code: zeigt automatisch auf die Adresse, unter der die Seite liegt */
const pageUrl = location.href.split("#")[0];
if (location.protocol === "file:") document.getElementById("hint").hidden = false;
try {
  new QRCode(document.getElementById("qrcode"), {
    text: pageUrl,
    width: 200,
    height: 200,
    colorDark: "#14283a",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.M
  });
} catch (e) {
  document.getElementById("qrcode").textContent = "QR-Code konnte nicht geladen werden.";
}
</script>
</body>
</html>
